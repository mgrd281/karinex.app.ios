# Builds a signed App Store binary with fastlane and uploads it to TestFlight.
#
# Required repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect API key (role App Manager or Admin)
#   ASC_KEY_CONTENT             the .p8 key file, base64 encoded (`base64 -i AuthKey_XXXX.p8`)
#   KX_APPLE_TEAM_ID            Apple Developer team ID
# Optional (empty keeps the app's documented fallback, e.g. tokenless Storefront access):
#   KX_STOREFRONT_ACCESS_TOKEN, KX_CUSTOMER_ACCOUNT_CLIENT_ID
#
# The build number is the latest TestFlight build number + 1 (see fastlane/Fastfile).

name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  beta:
    name: Build and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install XcodeGen 2.46.0 (project consistency check in the beta lane)
        run: scripts/install-tools.sh --dir "$RUNNER_TEMP/tools" xcodegen | tail -n 1 >> "$GITHUB_PATH"

      - name: fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          KX_APPLE_TEAM_ID: ${{ secrets.KX_APPLE_TEAM_ID }}
          KX_STOREFRONT_ACCESS_TOKEN: ${{ secrets.KX_STOREFRONT_ACCESS_TOKEN }}
          KX_CUSTOMER_ACCOUNT_CLIENT_ID: ${{ secrets.KX_CUSTOMER_ACCOUNT_CLIENT_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: bundle exec fastlane beta

      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          if-no-files-found: ignore
          retention-days: 7
