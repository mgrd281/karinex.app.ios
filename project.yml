# XcodeGen project specification. This file is the source of truth for
# KARINEX.xcodeproj. After editing it, run `make project` and commit both files.
# CI fails if the committed project is out of date.
name: KARINEX

options:
  bundleIdPrefix: de.karinex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top
  localPackagesGroup: Packages
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Core:
    path: Packages/Core
  ShopifyKit:
    path: Packages/ShopifyKit
  Backend:
    path: Packages/Backend
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

fileGroups:
  - Config
  - App/KARINEX.entitlements
  - project.yml

targets:
  KARINEX:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Widgets/Shared
    settings:
      base:
        PRODUCT_NAME: KARINEX
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Empty unless Config/Secrets.xcconfig sets it (needs a team ID), see Config/Base.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(KX_CODE_SIGN_ENTITLEMENTS)
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: KARINEXWidgets
      - package: Core
      - package: ShopifyKit
      - package: Backend
        products:
          - BackendKit
      - package: DesignSystem
        products:
          - DesignSystem
          - DesignTokens
      - package: Features
        products:
          - CommerceUI
          - HomeFeature
          - CatalogFeature
          - SearchFeature
          - CartFeature
          - AccountFeature
          - ProductFeature
          - CheckoutFeature
          - LicensesFeature
          - SupportFeature
          - LegalFeature
          - SettingsFeature

  KARINEXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets/Extension
      - path: App/Widgets/Shared
      - path: App/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: KARINEXWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID).widgets
        INFOPLIST_FILE: App/Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Core
      - package: ShopifyKit
      - package: DesignSystem
        products:
          - DesignTokens

  KARINEXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KARINEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KARINEX
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: KARINEX

  KARINEXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KARINEX
    dependencies:
      - target: KARINEX

schemes:
  KARINEX:
    build:
      targets:
        KARINEX: all
        KARINEXTests: [test]
        KARINEXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - KARINEX
        - package: Core/Core
        - package: ShopifyKit/ShopifyKit
        - package: Backend/BackendKit
        - package: DesignSystem/DesignTokens
        - package: DesignSystem/DesignSystem
        - package: Features/CommerceUI
        - package: Features/ProductFeature
        - package: Features/CheckoutFeature
        - package: Features/AccountFeature
        - package: Features/LicensesFeature
        - package: Features/SupportFeature
        - package: Features/LegalFeature
        - package: Features/SettingsFeature
      targets:
        - name: KARINEXTests
          parallelizable: false
        - package: Core/CoreTests
        - package: ShopifyKit/ShopifyKitTests
        - package: Backend/BackendKitTests
        - package: DesignSystem/DesignTokensTests
        - package: DesignSystem/DesignSystemTests
        - package: Features/CommerceUITests
        - package: Features/FeaturesTests
        - name: KARINEXUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
