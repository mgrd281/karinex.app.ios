# XcodeGen project specification. This file is the source of truth for
# KARINEX.xcodeproj. After editing it, run `make project` and commit both files.
# CI fails if the committed project is out of date.
name: KARINEX

options:
  bundleIdPrefix: de.karinex
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
  groupSortPosition: top
  localPackagesGroup: Packages
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Core:
    path: Packages/Core
  ShopifyKit:
    path: Packages/ShopifyKit
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features

fileGroups:
  - Config
  - project.yml

targets:
  KARINEX:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: KARINEX
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Core
      - package: ShopifyKit
      - package: DesignSystem
        products:
          - DesignSystem
          - DesignTokens
      - package: Features
        products:
          - HomeFeature
          - CatalogFeature
          - SearchFeature
          - CartFeature
          - AccountFeature

  KARINEXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/KARINEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/KARINEX
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: KARINEX

  KARINEXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KX_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KARINEX
    dependencies:
      - target: KARINEX

schemes:
  KARINEX:
    build:
      targets:
        KARINEX: all
        KARINEXTests: [test]
        KARINEXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - KARINEX
        - package: Core/Core
        - package: ShopifyKit/ShopifyKit
        - package: DesignSystem/DesignTokens
        - package: DesignSystem/DesignSystem
      targets:
        - name: KARINEXTests
          parallelizable: false
        - package: Core/CoreTests
        - package: ShopifyKit/ShopifyKitTests
        - package: DesignSystem/DesignTokensTests
        - package: DesignSystem/DesignSystemTests
        - package: Features/FeaturesTests
        - name: KARINEXUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
